<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify OTP</title>

    <!-- Bootstrap -->
    <link href=
"https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body{
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .otp-card{
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .otp-title{
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .otp-subtitle{
            text-align: center;
            color: gray;
            margin-bottom: 30px;
        }

        .otp-input{
            height: 50px;
            text-align: center;
            font-size: 20px;
            letter-spacing: 5px;
        }

        .verify-btn{
            height: 50px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="otp-card">

    <h2 class="otp-title">
        OTP Verification
    </h2>

    <p class="otp-subtitle">
        Enter the OTP sent to your email
    </p>


    <!-- Success Message -->
    <div th:if="${message}"
         class="alert alert-success">

        <span th:text="${message}"></span>

    </div>


    <!-- Error Message -->
    <div th:if="${error}"
         class="alert alert-danger">

        <span th:text="${error}"></span>

    </div>


    <!-- OTP FORM -->
    <form th:action="@{/verify-otp}"
      method="post">

    <!-- CSRF TOKEN -->
    <input type="hidden"
           th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}" />

    <div class="mb-4">

        <input type="text"
               name="otp"
               class="form-control otp-input"
               placeholder="Enter OTP"
               maxlength="6"
               required>

    </div>

    <div class="d-grid">

        <button type="submit"
                class="btn btn-primary verify-btn">

            Verify OTP

        </button>

    </div>

</form>


    <!-- Back To Register -->
    <div class="text-center mt-4">

        <a th:href="@{/register}">
            Back to Register
        </a>

    </div>

</div>

</body>
</html>
